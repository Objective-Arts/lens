# Workflow Phases
#
# These phases are used BOTH:
# - As standalone commands: /plan, /structure-first, /implement, etc.
# - As Ralph loop steps: cycles through all phases in order
#
# Each phase has experts suited to that activity.

phases:
  plan:
    description: Understand requirements, design approach
    experts:
      - kernighan      # Clarity of requirements
      - pike           # Minimal interfaces
      - bill-joy
      - thompson
      - linus          # Data structures first thinking
      - dijkstra       # Correctness, invariants
      - liskov         # Type contracts
      - taleb          # Antifragility, black swans
      - petroski       # Learn from failures
      - leveson        # Safety as system property

  structure-first:
    description: Design data structures and types before code
    experts:
      - linus          # Data structures first
      - dijkstra       # Invariants, formal correctness
      - liskov         # Substitution principle
      - bloch          # API/data structure design
      - gang-of-four   # Structural patterns
      - thompson

  implement:
    description: Write the code
    experts:
      - thompson       # Get it working first
      - kernighan      # Keep it readable
      - pike           # Composition over complexity
      - mcilroy        # Unix philosophy, pipelines
      - bill-joy       # Failure handling
      - carmack        # Performance awareness
      # Language-specific loaded from profile

  build-tests:
    description: Write tests for implemented code (tests follow code, not TDD)
    experts:
      - meszaros       # xUnit patterns, test doubles
      - fowler-test    # Test pyramid, test strategy
      - dodds          # Testing Trophy, integration focus
      - hevery         # Testable code design
      - feathers       # Characterization tests for existing code

  refactor-check:
    description: Simplify and clean up, verify still works
    experts:
      - kernighan      # Simplify, clarify
      - thompson       # Remove cruft
      - feathers       # Safe refactoring with seams
      - gang-of-four   # Pattern-based refactoring
      - pike           # Reduce interfaces
      - fowler-refactor # wrote the book 

  independent-review:
    description: Independent code review via Gemini - bugs, edge cases, quality
    # No Claude experts - Gemini handles the review
    experts: []

  static-analysis:
    description: Run Qodana analyzer, fix issues found
    # No Claude experts - Qodana handles static analysis
    experts: []

  doc-code:
    description: Document the completed work
    experts:
      - procida        # Diátaxis framework
      - strunk-white   # Omit needless words
      - zinsser        # Clarity, simplicity
      - king           # Kill your darlings
      - kernighan      # Clear explanation

# Ralph loops through phases in this order:
# Refactor-check comes BEFORE test phase - uses existing project tests only
ralph-sequence:
  - plan
  - structure-first
  - implement
  - refactor-check
  - independent-review
  - static-analysis
  - test
  - doc-code

# Post-loop phases run ONCE after all PRD items complete
# Order matters: security review first, production readiness last (applies final fixes)
post-loop:
  - security-review       # Adversarial security review - think like an attacker
  - production-readiness  # Final production readiness check and fixes
