<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude-Optimal Architecture</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { color: #58a6ff; margin-bottom: 0.5rem; font-size: 1.8rem; }
    .subtitle { color: #8b949e; margin-bottom: 2rem; }
    #diagram { width: 1100px; height: 580px; }
  </style>
</head>
<body>
  <h1>Claude-Optimal Architecture</h1>
  <p class="subtitle">Expert-enforced code quality through profiles and workflow skills</p>
  <svg id="diagram"></svg>

  <script>
    const svg = d3.select("#diagram");
    const width = 1100;
    const height = 580;

    svg.attr("width", width).attr("height", height);

    // Arrow marker
    const defs = svg.append("defs");
    defs.append("marker")
      .attr("id", "arrow")
      .attr("viewBox", "0 -5 10 10")
      .attr("refX", 10)
      .attr("refY", 0)
      .attr("markerWidth", 8)
      .attr("markerHeight", 8)
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M0,-5L10,0L0,5")
      .attr("fill", "#58a6ff");

    const boxWidth = 240;
    const boxHeight = 420;
    const startY = 60;

    // === BOX 1: CANON ===
    const canon = svg.append("g").attr("transform", `translate(20, ${startY})`);

    canon.append("rect")
      .attr("width", boxWidth)
      .attr("height", boxHeight)
      .attr("rx", 8)
      .attr("fill", "#161b22")
      .attr("stroke", "#f0883e")
      .attr("stroke-width", 2);

    canon.append("text").attr("x", boxWidth/2).attr("y", 28).attr("text-anchor", "middle")
      .attr("fill", "#f0883e").attr("font-weight", "bold").attr("font-size", "15px")
      .text("CANON");

    canon.append("text").attr("x", boxWidth/2).attr("y", 48).attr("text-anchor", "middle")
      .attr("fill", "#8b949e").attr("font-size", "11px")
      .text("30+ Expert Skills Library");

    canon.append("line").attr("x1", 15).attr("y1", 60).attr("x2", boxWidth-15).attr("y2", 60)
      .attr("stroke", "#30363d");

    const canonExperts = [
      { name: "kernighan", what: "Clarity, readability, style" },
      { name: "bloch", what: "API design, effective patterns" },
      { name: "schneier", what: "Security mindset, threats" },
      { name: "dodds", what: "Testing Trophy, integration" },
      { name: "gang-of-four", what: "23 design patterns" },
      { name: "liskov", what: "Substitution principle" },
      { name: "pike", what: "Small interfaces, composition" },
      { name: "meszaros", what: "xUnit patterns, test doubles" },
      { name: "owasp", what: "Top 10 vulnerabilities" },
      { name: "procida", what: "Diátaxis documentation" },
      { name: "feathers", what: "Legacy code, seams" },
      { name: "thompson", what: "Get it working first" },
    ];

    canonExperts.forEach((exp, i) => {
      canon.append("text").attr("x", 15).attr("y", 82 + i * 26)
        .attr("fill", "#f0883e").attr("font-size", "11px").attr("font-weight", "bold")
        .text(exp.name);
      canon.append("text").attr("x", 90).attr("y", 82 + i * 26)
        .attr("fill", "#8b949e").attr("font-size", "10px")
        .text(exp.what);
    });

    canon.append("text").attr("x", boxWidth/2).attr("y", boxHeight - 25).attr("text-anchor", "middle")
      .attr("fill", "#6e7681").attr("font-size", "10px").attr("font-style", "italic")
      .text("Location: canon/ directory");

    canon.append("text").attr("x", boxWidth/2).attr("y", boxHeight - 10).attr("text-anchor", "middle")
      .attr("fill", "#6e7681").attr("font-size", "10px").attr("font-style", "italic")
      .text("+ 18 more experts...");

    // === BOX 2: PROFILE ===
    const profile = svg.append("g").attr("transform", `translate(290, ${startY})`);

    profile.append("rect")
      .attr("width", boxWidth)
      .attr("height", boxHeight)
      .attr("rx", 8)
      .attr("fill", "#161b22")
      .attr("stroke", "#1f6feb")
      .attr("stroke-width", 2);

    profile.append("text").attr("x", boxWidth/2).attr("y", 28).attr("text-anchor", "middle")
      .attr("fill", "#1f6feb").attr("font-weight", "bold").attr("font-size", "15px")
      .text("PROFILE");

    profile.append("text").attr("x", boxWidth/2).attr("y", 48).attr("text-anchor", "middle")
      .attr("fill", "#8b949e").attr("font-size", "11px")
      .text("Your Project Configuration");

    profile.append("line").attr("x1", 15).attr("y1", 60).attr("x2", boxWidth-15).attr("y2", 60)
      .attr("stroke", "#30363d");

    profile.append("text").attr("x", 15).attr("y", 82)
      .attr("fill", "#c9d1d9").attr("font-size", "11px").attr("font-weight", "bold")
      .text("What it does:");
    profile.append("text").attr("x", 15).attr("y", 100)
      .attr("fill", "#8b949e").attr("font-size", "10px")
      .text("Selects which experts apply");
    profile.append("text").attr("x", 15).attr("y", 115)
      .attr("fill", "#8b949e").attr("font-size", "10px")
      .text("to your project type");

    profile.append("text").attr("x", 15).attr("y", 145)
      .attr("fill", "#c9d1d9").attr("font-size", "11px").attr("font-weight", "bold")
      .text("Available profiles:");

    const profiles = ["javascript", "python", "java", "csharp", "angular", "react", "d3", "frontend", "sql", "security"];
    profiles.forEach((p, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      profile.append("text").attr("x", 20 + col * 110).attr("y", 165 + row * 18)
        .attr("fill", "#1f6feb").attr("font-size", "10px").attr("font-family", "monospace")
        .text(p);
    });

    profile.append("text").attr("x", 15).attr("y", 270)
      .attr("fill", "#c9d1d9").attr("font-size", "11px").attr("font-weight", "bold")
      .text("Usage:");
    profile.append("text").attr("x", 15).attr("y", 290)
      .attr("fill", "#8b949e").attr("font-size", "9px").attr("font-family", "monospace")
      .text("cc-config profile apply");
    profile.append("text").attr("x", 15).attr("y", 305)
      .attr("fill", "#8b949e").attr("font-size", "9px").attr("font-family", "monospace")
      .text("javascript+security .");

    profile.append("text").attr("x", 15).attr("y", 335)
      .attr("fill", "#c9d1d9").attr("font-size", "11px").attr("font-weight", "bold")
      .text("Creates:");
    profile.append("text").attr("x", 15).attr("y", 355)
      .attr("fill", "#8b949e").attr("font-size", "10px")
      .text("• CLAUDE.md with standards");
    profile.append("text").attr("x", 15).attr("y", 372)
      .attr("fill", "#8b949e").attr("font-size", "10px")
      .text("• .claude/skills/ with experts");
    profile.append("text").attr("x", 15).attr("y", 389)
      .attr("fill", "#8b949e").attr("font-size", "10px")
      .text("• Anti-patterns to avoid");

    // === BOX 3: WORKFLOW SKILLS ===
    const workflow = svg.append("g").attr("transform", `translate(560, ${startY})`);

    workflow.append("rect")
      .attr("width", boxWidth)
      .attr("height", boxHeight)
      .attr("rx", 8)
      .attr("fill", "#161b22")
      .attr("stroke", "#a371f7")
      .attr("stroke-width", 2);

    workflow.append("text").attr("x", boxWidth/2).attr("y", 28).attr("text-anchor", "middle")
      .attr("fill", "#a371f7").attr("font-weight", "bold").attr("font-size", "15px")
      .text("WORKFLOW SKILLS");

    workflow.append("text").attr("x", boxWidth/2).attr("y", 48).attr("text-anchor", "middle")
      .attr("fill", "#8b949e").attr("font-size", "11px")
      .text("Commands You Invoke");

    workflow.append("line").attr("x1", 15).attr("y1", 60).attr("x2", boxWidth-15).attr("y2", 60)
      .attr("stroke", "#30363d");

    const workflows = [
      { cmd: "/plan", experts: "kernighan, pike, dijkstra, linus" },
      { cmd: "/structure-first", experts: "bloch, liskov, cherny" },
      { cmd: "/implement", experts: "bloch, gang-of-four, thompson" },
      { cmd: "/test", experts: "dodds, meszaros, fowler-test" },
      { cmd: "/refactor-check", experts: "kernighan, feathers, gang-of-four" },
      { cmd: "/adversarial-review", experts: "schneier, owasp, petroski" },
      { cmd: "/doc-code", experts: "procida, strunk-white, zinsser" },
    ];

    workflows.forEach((wf, i) => {
      const y = 82 + i * 48;
      workflow.append("text").attr("x", 15).attr("y", y)
        .attr("fill", "#a371f7").attr("font-size", "12px").attr("font-family", "monospace").attr("font-weight", "bold")
        .text(wf.cmd);
      workflow.append("text").attr("x", 25).attr("y", y + 16)
        .attr("fill", "#8b949e").attr("font-size", "9px")
        .text("→ " + wf.experts);
    });

    workflow.append("text").attr("x", boxWidth/2).attr("y", boxHeight - 25).attr("text-anchor", "middle")
      .attr("fill", "#3fb950").attr("font-size", "11px").attr("font-weight", "bold")
      .text("Step 0: Load expert context");
    workflow.append("text").attr("x", boxWidth/2).attr("y", boxHeight - 10).attr("text-anchor", "middle")
      .attr("fill", "#8b949e").attr("font-size", "10px")
      .text("before executing any command");

    // === BOX 4: OUTPUT ===
    const output = svg.append("g").attr("transform", `translate(830, ${startY})`);

    output.append("rect")
      .attr("width", boxWidth)
      .attr("height", boxHeight)
      .attr("rx", 8)
      .attr("fill", "#161b22")
      .attr("stroke", "#238636")
      .attr("stroke-width", 2);

    output.append("text").attr("x", boxWidth/2).attr("y", 28).attr("text-anchor", "middle")
      .attr("fill", "#238636").attr("font-weight", "bold").attr("font-size", "15px")
      .text("OUTPUT");

    output.append("text").attr("x", boxWidth/2).attr("y", 48).attr("text-anchor", "middle")
      .attr("fill", "#8b949e").attr("font-size", "11px")
      .text("Quality Code");

    output.append("line").attr("x1", 15).attr("y1", 60).attr("x2", boxWidth-15).attr("y2", 60)
      .attr("stroke", "#30363d");

    output.append("text").attr("x", 15).attr("y", 82)
      .attr("fill", "#c9d1d9").attr("font-size", "11px").attr("font-weight", "bold")
      .text("Standards enforced:");

    const standards = [
      "Clarity over cleverness",
      "Small, composable interfaces",
      "Security-first thinking",
      "Comprehensive test coverage",
      "Proper design patterns",
      "Effective API design",
      "Clean documentation"
    ];
    standards.forEach((s, i) => {
      output.append("text").attr("x", 20).attr("y", 102 + i * 20)
        .attr("fill", "#3fb950").attr("font-size", "10px")
        .text("✓ " + s);
    });

    output.append("text").attr("x", 15).attr("y", 260)
      .attr("fill", "#c9d1d9").attr("font-size", "11px").attr("font-weight", "bold")
      .text("Anti-patterns prevented:");

    const antipatterns = [
      "Clever, unreadable code",
      "Security vulnerabilities",
      "Untested code paths",
      "God objects, deep inheritance",
      "Poor error handling"
    ];
    antipatterns.forEach((a, i) => {
      output.append("text").attr("x", 20).attr("y", 280 + i * 20)
        .attr("fill", "#f85149").attr("font-size", "10px")
        .text("✗ " + a);
    });

    output.append("rect").attr("x", 15).attr("y", boxHeight - 55).attr("width", boxWidth - 30).attr("height", 40)
      .attr("rx", 6).attr("fill", "#238636").attr("opacity", 0.2);
    output.append("text").attr("x", boxWidth/2).attr("y", boxHeight - 30).attr("text-anchor", "middle")
      .attr("fill", "#3fb950").attr("font-size", "12px").attr("font-weight", "bold")
      .text("LLM can't write bad code");

    // === ARROWS ===
    const arrowY = startY + boxHeight / 2;

    // Arrow 1: Canon -> Profile
    svg.append("path")
      .attr("d", `M 265 ${arrowY} L 285 ${arrowY}`)
      .attr("fill", "none").attr("stroke", "#58a6ff").attr("stroke-width", 2)
      .attr("marker-end", "url(#arrow)");
    svg.append("text").attr("x", 275).attr("y", arrowY - 15).attr("text-anchor", "middle")
      .attr("fill", "#58a6ff").attr("font-size", "9px").text("loads");
    svg.append("text").attr("x", 275).attr("y", arrowY + 20).attr("text-anchor", "middle")
      .attr("fill", "#58a6ff").attr("font-size", "9px").text("into");

    // Arrow 2: Profile -> Workflow
    svg.append("path")
      .attr("d", `M 535 ${arrowY} L 555 ${arrowY}`)
      .attr("fill", "none").attr("stroke", "#58a6ff").attr("stroke-width", 2)
      .attr("marker-end", "url(#arrow)");
    svg.append("text").attr("x", 545).attr("y", arrowY - 15).attr("text-anchor", "middle")
      .attr("fill", "#58a6ff").attr("font-size", "9px").text("you");
    svg.append("text").attr("x", 545).attr("y", arrowY + 20).attr("text-anchor", "middle")
      .attr("fill", "#58a6ff").attr("font-size", "9px").text("invoke");

    // Arrow 3: Workflow -> Output
    svg.append("path")
      .attr("d", `M 805 ${arrowY} L 825 ${arrowY}`)
      .attr("fill", "none").attr("stroke", "#58a6ff").attr("stroke-width", 2)
      .attr("marker-end", "url(#arrow)");
    svg.append("text").attr("x", 815).attr("y", arrowY - 15).attr("text-anchor", "middle")
      .attr("fill", "#58a6ff").attr("font-size", "9px").text("produces");

  </script>
</body>
</html>
