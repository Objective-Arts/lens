# Canon Skill Detection Rules
# Edit this file to control which skills trigger for which keywords
# Rules are processed in order; all matching rules accumulate skills
#
# Format:
#   category:
#     patterns: [keyword1, keyword2, ...]   # Case-insensitive word boundaries
#     skills: [skill1, skill2, ...]          # Skills to activate
#     stages: [plan, build, ...]             # Stages where rule applies

rules:
  security:
    patterns:
      - auth
      - password
      - login
      - token
      - jwt
      - oauth
      - credential
      - secret
      - encrypt
      - hash
      - session
      - permission
      - role
      - access control
      - csrf
      - xss
      - injection
      - sanitiz
      - valid
    skills:
      - schneier
      - owasp
      - tanya-janca
      - troy-hunt
      - security-mindset
    stages:
      - plan
      - build
      - review

  database:
