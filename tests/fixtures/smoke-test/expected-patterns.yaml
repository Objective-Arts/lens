# Expected outcomes for smoke test
# Used by test runner to validate results

should_not_exist:
  - pattern: "async void"
    except: "event handler"
  - pattern: ".Result"
  - pattern: ".Wait()"
  - pattern: "\" + "
    description: "String concatenation in SQL"

should_exist:
  - pattern: "async Task"
  - pattern: "?."
    description: "Null conditional or null check"
  - pattern: "@"
    description: "Parameterized query indicator"

invariants:
  - prd_items_complete: true
  - max_iterations: 10
  - git_commits_created: true
