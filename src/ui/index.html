<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cc-config</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       DESIGN TOKENS (Curtis)
       Semantic naming, single source of truth
    ═══════════════════════════════════════════════════════════════════════ */
    :root {
      /* Color - Gray scale (Ive: 90% of UI) */
      --gray-950: #0a0a0f;
      --gray-900: #12121a;
      --gray-800: #1e1e2a;
      --gray-700: #2a2a3a;
      --gray-600: #3a3a4a;
      --gray-500: #5a5a6a;
      --gray-400: #8a8a9a;
      --gray-300: #b0b0c0;
      --gray-200: #d0d0e0;
      --gray-100: #e8e8f0;

      /* Color - Accent (Ive: ONE color, used sparingly) */
      --accent: #00d9ff;
      --accent-dim: rgba(0, 217, 255, 0.15);
      --accent-hover: #00f0ff;

      /* Color - Semantic */
      --success: #00c48c;
      --warning: #ffb020;
      --error: #ff4757;

      /* Typography (Kruzeniski) */
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-lg: 17px;
      --text-xl: 20px;
      --text-2xl: 24px;

      --font-normal: 400;
      --font-medium: 500;
      --font-semibold: 600;

      /* Spacing (Rams: 4px base) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;

      /* Border radius (Ive: consistent scale) */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;

      /* Shadows (Ive: 4 levels max) */
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-2: 0 4px 8px rgba(0, 0, 0, 0.25);
      --shadow-3: 0 8px 16px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 20px rgba(0, 217, 255, 0.15);

      /* Motion (Duarte) */
      --duration-instant: 50ms;
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
      --ease-in: cubic-bezier(0.4, 0.0, 1, 1);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       RESET & BASE (Rams: nothing arbitrary)
    ═══════════════════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--gray-200);
      background: var(--gray-950);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ATOMS (Frost)
    ═══════════════════════════════════════════════════════════════════════ */

    /* Button atom */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-height: 44px; /* Norman: touch target */
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--gray-200);
      background: var(--gray-700);
      border: 1px solid var(--gray-600);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      user-select: none;
    }

    .btn:hover {
      background: var(--gray-600);
      border-color: var(--gray-500);
    }

    .btn:active {
      transform: scale(0.98); /* Duarte: physical feedback */
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn--primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--gray-950);
    }

    .btn--primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn--ghost {
      background: transparent;
      border-color: transparent;
    }

    .btn--ghost:hover {
      background: var(--gray-800);
    }

    .btn--sm {
      min-height: 36px;
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-xs);
    }

    /* Badge atom */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-2);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge--success {
      background: rgba(0, 196, 140, 0.15);
      color: var(--success);
    }

    .badge--warning {
      background: rgba(255, 176, 32, 0.15);
      color: var(--warning);
    }

    .badge--muted {
      background: var(--gray-800);
      color: var(--gray-400);
    }

    /* Toggle atom */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--gray-700);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background var(--duration-fast) var(--ease-out);
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: var(--gray-300);
      border-radius: 50%;
      transition: transform var(--duration-fast) var(--ease-out);
    }

    .toggle.is-on {
      background: var(--accent);
    }

    .toggle.is-on::after {
      transform: translateX(20px);
      background: var(--gray-950);
    }

    .toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Icon atom */
    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .icon--sm {
      width: 16px;
      height: 16px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       MOLECULES (Frost)
    ═══════════════════════════════════════════════════════════════════════ */

    /* Card molecule */
    .card {
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      transition: border-color var(--duration-fast) var(--ease-out),
                  box-shadow var(--duration-fast) var(--ease-out);
    }

    .card:hover {
      border-color: var(--gray-700);
    }

    .card--interactive:hover {
      box-shadow: var(--shadow-glow);
      border-color: var(--accent-dim);
    }

    /* Server card molecule */
    .server-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .server-card__info {
      flex: 1;
      min-width: 0;
    }

    .server-card__name {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--gray-100);
      margin-bottom: var(--space-1);
    }

    .server-card__desc {
      font-size: var(--text-sm);
      color: var(--gray-400);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .server-card__actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    /* Tool card molecule */
    .tool-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .tool-card__icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-800);
      border-radius: var(--radius-md);
      color: var(--accent);
    }

    .tool-card__info {
      flex: 1;
    }

    .tool-card__name {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--gray-100);
    }

    .tool-card__path {
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      color: var(--gray-500);
    }

    /* Section header molecule */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .section-header__title {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--gray-100);
    }

    .section-header__count {
      font-size: var(--text-sm);
      color: var(--gray-500);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ORGANISMS (Frost)
    ═══════════════════════════════════════════════════════════════════════ */

    /* Header organism */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-6);
      background: var(--gray-900);
      border-bottom: 1px solid var(--gray-800);
    }

    .header__brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .header__logo {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
      color: var(--accent);
      font-family: var(--font-mono);
    }

    .header__version {
      font-size: var(--text-xs);
      color: var(--gray-500);
      font-family: var(--font-mono);
    }

    /* Nav organism */
    .nav {
      display: flex;
      gap: var(--space-1);
    }

    .nav__item {
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--gray-400);
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .nav__item:hover {
      color: var(--gray-200);
      background: var(--gray-800);
    }

    .nav__item.is-active {
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* List organism */
    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TEMPLATE (Frost)
    ═══════════════════════════════════════════════════════════════════════ */

    .dashboard {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    .dashboard__section {
      margin-bottom: var(--space-8);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FEEDBACK & STATES (Norman, Duarte)
    ═══════════════════════════════════════════════════════════════════════ */

    /* Toast feedback */
    .toast {
      position: fixed;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: var(--space-3) var(--space-5);
      background: var(--gray-800);
      border: 1px solid var(--gray-700);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: var(--gray-100);
      box-shadow: var(--shadow-3);
      opacity: 0;
      transition: transform var(--duration-normal) var(--ease-out),
                  opacity var(--duration-normal) var(--ease-out);
      z-index: 1000;
    }

    .toast.is-visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast--success {
      border-color: var(--success);
    }

    /* Loading state */
    .is-loading {
      opacity: 0.6;
      pointer-events: none;
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--gray-800) 25%,
        var(--gray-700) 50%,
        var(--gray-800) 75%
      );
      background-size: 200% 100%;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       RESPONSIVE (Wroblewski: mobile-first)
    ═══════════════════════════════════════════════════════════════════════ */

    @media (max-width: 640px) {
      .header {
        padding: var(--space-3) var(--space-4);
      }

      .dashboard {
        padding: var(--space-4);
      }

      .server-card {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }

      .server-card__actions {
        width: 100%;
        justify-content: space-between;
      }

      .tool-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ACCESSIBILITY (Buxton, Norman)
    ═══════════════════════════════════════════════════════════════════════ */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Screen reader only */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Focus visible for keyboard users */
    :focus:not(:focus-visible) {
      outline: none;
    }
  </style>
</head>
<body>
  <!-- Header organism -->
  <header class="header">
    <div class="header__brand">
      <span class="header__logo">cc-config</span>
      <span class="header__version">v1.0.0</span>
    </div>
    <nav class="nav" role="navigation" aria-label="Main">
      <button class="nav__item is-active" data-tab="servers">Servers</button>
      <button class="nav__item" data-tab="tools">Tools</button>
      <button class="nav__item" data-tab="settings">Settings</button>
    </nav>
  </header>

  <!-- Dashboard template -->
  <main class="dashboard" role="main">

    <!-- Servers section -->
    <section class="dashboard__section" id="section-servers">
      <div class="section-header">
        <h2 class="section-header__title">MCP Servers</h2>
        <span class="section-header__count" id="server-count">Loading...</span>
      </div>
      <div class="list" id="server-list">
        <!-- Skeleton loading state -->
        <div class="card">
          <div class="server-card">
            <div class="server-card__info">
              <div class="skeleton" style="width: 120px; height: 18px; margin-bottom: 6px;"></div>
              <div class="skeleton" style="width: 200px; height: 14px;"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="server-card">
            <div class="server-card__info">
              <div class="skeleton" style="width: 150px; height: 18px; margin-bottom: 6px;"></div>
              <div class="skeleton" style="width: 180px; height: 14px;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tools section (hidden by default) -->
    <section class="dashboard__section" id="section-tools" style="display: none;">
      <div class="section-header">
        <h2 class="section-header__title">Tools</h2>
        <span class="section-header__count" id="tool-count">Loading...</span>
      </div>
      <div class="list" id="tool-list">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Settings section (hidden by default) -->
    <section class="dashboard__section" id="section-settings" style="display: none;">
      <div class="section-header">
        <h2 class="section-header__title">Settings</h2>
      </div>
      <div class="card">
        <p style="color: var(--gray-400);">Settings panel coming soon.</p>
      </div>
    </section>

  </main>

  <!-- Toast for feedback (Norman: every action needs response) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════
    const state = {
      servers: [],
      tools: [],
      activeTab: 'servers'
    };

    // ═══════════════════════════════════════════════════════════════════════
    // API (connects to cc-config server)
    // ═══════════════════════════════════════════════════════════════════════
    const API_BASE = 'http://localhost:3847/api';

    async function fetchData(endpoint) {
      try {
        const res = await fetch(`${API_BASE}${endpoint}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.error(`API error: ${endpoint}`, err);
        return null;
      }
    }

    async function postData(endpoint, data = {}) {
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.error(`API error: ${endpoint}`, err);
        return null;
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // COMPONENTS (Frost: atoms compose into molecules)
    // ═══════════════════════════════════════════════════════════════════════

    function renderToggle(isOn, onChange) {
      const toggle = document.createElement('button');
      toggle.className = `toggle ${isOn ? 'is-on' : ''}`;
      toggle.setAttribute('role', 'switch');
      toggle.setAttribute('aria-checked', isOn);
      toggle.onclick = () => {
        const newState = !toggle.classList.contains('is-on');
        toggle.classList.toggle('is-on');
        toggle.setAttribute('aria-checked', newState);
        onChange(newState);
      };
      return toggle;
    }

    function renderServerCard(server) {
      const card = document.createElement('div');
      card.className = 'card card--interactive';
      card.innerHTML = `
        <div class="server-card">
          <div class="server-card__info">
            <div class="server-card__name">${escapeHtml(server.name)}</div>
            <div class="server-card__desc">${escapeHtml(server.description || 'MCP server')}</div>
          </div>
          <div class="server-card__actions">
            <span class="badge ${server.enabled ? 'badge--success' : 'badge--muted'}">
              ${server.enabled ? 'Enabled' : 'Disabled'}
            </span>
          </div>
        </div>
      `;

      const toggle = renderToggle(server.enabled, async (newState) => {
        const result = await postData(`/mcp-servers/${server.name}/toggle`, { enabled: newState });
        if (result) {
          showToast(`${server.name} ${newState ? 'enabled' : 'disabled'}`, 'success');
          // Update badge (Cooper: immediate feedback)
          const badge = card.querySelector('.badge');
          badge.className = `badge ${newState ? 'badge--success' : 'badge--muted'}`;
          badge.textContent = newState ? 'Enabled' : 'Disabled';
        }
      });

      card.querySelector('.server-card__actions').prepend(toggle);
      return card;
    }

    function renderToolCard(tool) {
      const card = document.createElement('div');
      card.className = 'card card--interactive';
      card.innerHTML = `
        <div class="tool-card">
          <div class="tool-card__icon">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </div>
          <div class="tool-card__info">
            <div class="tool-card__name">${escapeHtml(tool.name)}</div>
            <div class="tool-card__path">${tool.installed ? escapeHtml(tool.path) : 'Not installed'}</div>
          </div>
          <div style="margin-left: auto;">
            ${tool.installed
              ? `<button class="btn btn--sm" data-action="reinstall" data-tool="${escapeHtml(tool.name)}">Reinstall</button>`
              : `<button class="btn btn--sm btn--primary" data-action="install" data-tool="${escapeHtml(tool.name)}">Install</button>`
            }
          </div>
        </div>
      `;

      const btn = card.querySelector('button[data-action]');
      btn.onclick = async () => {
        btn.classList.add('is-loading');
        const result = await postData(`/tools/${tool.name}/install`, { force: true });
        btn.classList.remove('is-loading');
        if (result && result.success) {
          showToast(`${tool.name} installed`, 'success');
          loadTools(); // Refresh
        } else {
          showToast(`Failed to install ${tool.name}`, 'error');
        }
      };

      return card;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDERING
    // ═══════════════════════════════════════════════════════════════════════

    function renderServers() {
      const list = document.getElementById('server-list');
      const count = document.getElementById('server-count');

      list.innerHTML = '';

      if (state.servers.length === 0) {
        list.innerHTML = `
          <div class="card">
            <p style="color: var(--gray-400); text-align: center; padding: var(--space-4);">
              No MCP servers configured
            </p>
          </div>
        `;
        count.textContent = '0 servers';
        return;
      }

      state.servers.forEach(server => {
        list.appendChild(renderServerCard(server));
      });

      const enabled = state.servers.filter(s => s.enabled).length;
      count.textContent = `${enabled}/${state.servers.length} enabled`;
    }

    function renderTools() {
      const list = document.getElementById('tool-list');
      const count = document.getElementById('tool-count');

      list.innerHTML = '';

      if (state.tools.length === 0) {
        list.innerHTML = `
          <div class="card">
            <p style="color: var(--gray-400); text-align: center; padding: var(--space-4);">
              No tools available
            </p>
          </div>
        `;
        count.textContent = '0 tools';
        return;
      }

      state.tools.forEach(tool => {
        list.appendChild(renderToolCard(tool));
      });

      const installed = state.tools.filter(t => t.installed).length;
      count.textContent = `${installed}/${state.tools.length} installed`;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // DATA LOADING
    // ═══════════════════════════════════════════════════════════════════════

    async function loadServers() {
      const data = await fetchData('/mcp-servers');
      if (data) {
        state.servers = data;
        renderServers();
      } else {
        // Demo data for standalone viewing
        state.servers = [
          { name: 'gemini-reviewer', description: 'Code review via Gemini API', enabled: true },
          { name: 'qodana', description: 'Static analysis via Qodana', enabled: true },
          { name: 'sequential-thinking', description: 'Sequential reasoning', enabled: false }
        ];
        renderServers();
      }
    }

    async function loadTools() {
      const data = await fetchData('/tools');
      if (data) {
        state.tools = data;
        renderTools();
      } else {
        // Demo data for standalone viewing
        state.tools = [
          { name: 'ralph', description: 'Autonomous PRD loop', installed: true, path: '~/.local/bin/ralph' },
          { name: 'canon-report', description: 'Canon master visualization', installed: false, path: null }
        ];
        renderTools();
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // UI UTILITIES
    // ═══════════════════════════════════════════════════════════════════════

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast is-visible ${type === 'success' ? 'toast--success' : ''}`;

      setTimeout(() => {
        toast.classList.remove('is-visible');
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function switchTab(tab) {
      state.activeTab = tab;

      // Update nav (Norman: clear feedback)
      document.querySelectorAll('.nav__item').forEach(item => {
        item.classList.toggle('is-active', item.dataset.tab === tab);
      });

      // Update sections
      document.querySelectorAll('.dashboard__section').forEach(section => {
        const sectionTab = section.id.replace('section-', '');
        section.style.display = sectionTab === tab ? 'block' : 'none';
      });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════════════════

    document.querySelectorAll('.nav__item').forEach(item => {
      item.onclick = () => switchTab(item.dataset.tab);
    });

    // Load data
    loadServers();
    loadTools();
  </script>
</body>
</html>
