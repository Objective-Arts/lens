<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canon → Profile → Workflow → Quality Code</title>
  <style>
    /* dashboards: Simplicity, every pixel earns its place */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #fafafa;
      padding: 40px;
      color: #333;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }

    /* charts: Data-ink ratio - every element serves a purpose */
    svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* dashboards: Gray default, color only for meaning */
    .layer-box { fill: #f5f5f5; stroke: #ddd; stroke-width: 1; }
    .layer-box.canon { fill: #e8f4f8; stroke: #b8d4de; }
    .layer-box.profile { fill: #f0f4e8; stroke: #c8d4b8; }
    .layer-box.workflow { fill: #fff8e8; stroke: #e8d8b8; }
    .layer-box.quality { fill: #e8f8e8; stroke: #b8deb8; }

    .layer-label {
      font-size: 14px;
      font-weight: 600;
      fill: #444;
    }

    .layer-desc {
      font-size: 11px;
      fill: #777;
    }

    /* data-story: Direct labeling, no legends */
    .item-box { fill: white; stroke: #ccc; stroke-width: 1; rx: 4; }
    .item-box.highlight { stroke: #666; stroke-width: 1.5; }

    .item-label {
      font-size: 10px;
      fill: #555;
      font-family: 'SF Mono', Menlo, monospace;
    }

    .item-category {
      font-size: 9px;
      fill: #999;
    }

    /* d3: Transitions serve understanding */
    .flow-arrow {
      fill: none;
      stroke: #999;
      stroke-width: 1.5;
      marker-end: url(#arrowhead);
    }

    .flow-arrow.main {
      stroke: #666;
      stroke-width: 2;
    }

    .annotation {
      font-size: 10px;
      fill: #888;
      font-style: italic;
    }

    /* Legend - minimal, charts-approved */
    .legend {
      margin-top: 24px;
      display: flex;
      gap: 24px;
      font-size: 12px;
      color: #666;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 16px;
      height: 12px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <!-- data-story: Title states the insight -->
  <h1>Expert Knowledge Flows Through Profiles and Workflows to Produce Quality Code</h1>
  <p class="subtitle">Canon skills embed author expertise → Profiles compose skills for domains → Workflows orchestrate quality gates</p>

  <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- d3: Clean, minimal arrow marker -->
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#888"/>
      </marker>
      <marker id="arrowhead-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#555"/>
      </marker>
    </defs>

    <!-- ═══════════════════════════════════════════════════════════════════════
         LAYER 1: CANON (Expert Knowledge)
         charts: Small multiples - same structure, easy scanning
    ═══════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(20, 20)">
      <rect class="layer-box canon" x="0" y="0" width="220" height="560" rx="8"/>
      <text class="layer-label" x="16" y="30">Canon</text>
      <text class="layer-desc" x="16" y="46">Expert knowledge from authors</text>

      <!-- Category: Visualization -->
      <g transform="translate(12, 65)">
        <text class="item-category" x="0" y="0">visualization/</text>
        <rect class="item-box highlight" x="0" y="8" width="90" height="24"/>
        <text class="item-label" x="8" y="24">charts</text>
        <rect class="item-box" x="96" y="8" width="90" height="24"/>
        <text class="item-label" x="104" y="24">dashboards</text>
        <rect class="item-box" x="0" y="38" width="90" height="24"/>
        <text class="item-label" x="8" y="54">d3</text>
        <rect class="item-box" x="96" y="38" width="90" height="24"/>
        <text class="item-label" x="104" y="54">data-story</text>
      </g>

      <!-- Category: JavaScript -->
      <g transform="translate(12, 145)">
        <text class="item-category" x="0" y="0">javascript/</text>
        <rect class="item-box highlight" x="0" y="8" width="90" height="24"/>
        <text class="item-label" x="8" y="24">typescript</text>
        <rect class="item-box" x="96" y="8" width="90" height="24"/>
        <text class="item-label" x="104" y="24">js-safety</text>
        <rect class="item-box" x="0" y="38" width="90" height="24"/>
        <text class="item-label" x="8" y="54">js-internals</text>
        <rect class="item-box" x="96" y="38" width="90" height="24"/>
        <text class="item-label" x="104" y="54">react-test</text>
        <rect class="item-box" x="0" y="68" width="90" height="24"/>
        <text class="item-label" x="8" y="84">js-perf</text>
        <rect class="item-box" x="96" y="68" width="90" height="24"/>
        <text class="item-label" x="104" y="84">react-state</text>
      </g>

      <!-- Category: Core -->
      <g transform="translate(12, 265)">
        <text class="item-category" x="0" y="0">core/</text>
        <rect class="item-box highlight" x="0" y="8" width="90" height="24"/>
        <text class="item-label" x="8" y="24">clarity</text>
        <rect class="item-box" x="96" y="8" width="90" height="24"/>
        <text class="item-label" x="104" y="24">simplicity</text>
        <rect class="item-box" x="0" y="38" width="90" height="24"/>
        <text class="item-label" x="8" y="54">java</text>
        <rect class="item-box" x="96" y="38" width="90" height="24"/>
        <text class="item-label" x="104" y="54">abstraction</text>
        <rect class="item-box" x="0" y="68" width="90" height="24"/>
        <text class="item-label" x="8" y="84">correctness</text>
        <rect class="item-box" x="96" y="68" width="90" height="24"/>
        <text class="item-label" x="104" y="84">design-patterns</text>
      </g>

      <!-- Category: Testing -->
      <g transform="translate(12, 385)">
        <text class="item-category" x="0" y="0">testing/</text>
        <rect class="item-box" x="0" y="8" width="90" height="24"/>
        <text class="item-label" x="8" y="24">test-doubles</text>
        <rect class="item-box" x="96" y="8" width="90" height="24"/>
        <text class="item-label" x="104" y="24">legacy</text>
        <rect class="item-box" x="0" y="38" width="90" height="24"/>
        <text class="item-label" x="8" y="54">test-strategy</text>
      </g>

      <!-- Category: Security -->
      <g transform="translate(12, 465)">
        <text class="item-category" x="0" y="0">security/</text>
        <rect class="item-box" x="0" y="8" width="90" height="24"/>
        <text class="item-label" x="8" y="24">security-mindset</text>
        <rect class="item-box" x="96" y="8" width="90" height="24"/>
        <text class="item-label" x="104" y="24">owasp</text>
      </g>

      <text class="annotation" x="16" y="545">~70 expert skills</text>
    </g>

    <!-- Flow Arrow: Canon → Profile -->
    <path class="flow-arrow main" d="M 250,300 C 280,300 290,300 320,300" marker-end="url(#arrowhead-dark)"/>
    <text class="annotation" x="260" y="290">compose</text>

    <!-- ═══════════════════════════════════════════════════════════════════════
         LAYER 2: PROFILES (Domain Compositions)
    ═══════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(330, 80)">
      <rect class="layer-box profile" x="0" y="0" width="180" height="440" rx="8"/>
      <text class="layer-label" x="16" y="30">Profiles</text>
      <text class="layer-desc" x="16" y="46">Domain skill compositions</text>

      <!-- Profile items -->
      <g transform="translate(12, 65)">
        <rect class="item-box highlight" x="0" y="0" width="156" height="36"/>
        <text class="item-label" x="12" y="16">javascript.yaml</text>
        <text class="item-category" x="12" y="28">extends: software-base</text>

        <rect class="item-box" x="0" y="44" width="156" height="36"/>
        <text class="item-label" x="12" y="60">typescript-cli.yaml</text>
        <text class="item-category" x="12" y="72">extends: javascript</text>

        <rect class="item-box" x="0" y="88" width="156" height="36"/>
        <text class="item-label" x="12" y="104">react.yaml</text>
        <text class="item-category" x="12" y="116">extends: javascript</text>

        <rect class="item-box" x="0" y="132" width="156" height="36"/>
        <text class="item-label" x="12" y="148">angular.yaml</text>
        <text class="item-category" x="12" y="160">angular-core, angular-arch</text>

        <rect class="item-box" x="0" y="176" width="156" height="36"/>
        <text class="item-label" x="12" y="192">python.yaml</text>
        <text class="item-category" x="12" y="204">python-idioms, python-protocols</text>

        <rect class="item-box" x="0" y="220" width="156" height="36"/>
        <text class="item-label" x="12" y="236">d3.yaml</text>
        <text class="item-category" x="12" y="248">d3, charts, dashboards</text>

        <rect class="item-box" x="0" y="264" width="156" height="36"/>
        <text class="item-label" x="12" y="280">security.yaml</text>
        <text class="item-category" x="12" y="292">security-mindset, owasp</text>
      </g>

      <!-- What profiles define -->
      <g transform="translate(12, 375)">
        <text class="item-category" x="0" y="0">Profiles define:</text>
        <text class="item-category" x="0" y="14">• CLAUDE.md standards</text>
        <text class="item-category" x="0" y="28">• Phase-specific experts</text>
        <text class="item-category" x="0" y="42">• Auto-invoke triggers</text>
      </g>
    </g>

    <!-- Flow Arrow: Profile → Workflow -->
    <path class="flow-arrow main" d="M 520,300 C 550,300 560,300 590,300" marker-end="url(#arrowhead-dark)"/>
    <text class="annotation" x="530" y="290">activate</text>

    <!-- ═══════════════════════════════════════════════════════════════════════
         LAYER 3: WORKFLOW SKILLS (8 Phases)
    ═══════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(600, 40)">
      <rect class="layer-box workflow" x="0" y="0" width="180" height="520" rx="8"/>
      <text class="layer-label" x="16" y="30">Workflow Skills</text>
      <text class="layer-desc" x="16" y="46">8-phase quality pipeline</text>

      <!-- Phase boxes with phase numbers -->
      <g transform="translate(12, 65)">
        <!-- Phase 1: Plan -->
        <rect class="item-box" x="0" y="0" width="156" height="42"/>
        <text class="item-label" x="12" y="16">1. /plan</text>
        <text class="item-category" x="12" y="30">Create implementation plan</text>

        <!-- Phase 2: Structure -->
        <rect class="item-box" x="0" y="50" width="156" height="42"/>
        <text class="item-label" x="12" y="66">2. /structure-first</text>
        <text class="item-category" x="12" y="80">Design types/interfaces</text>

        <!-- Phase 3: Implement -->
        <rect class="item-box highlight" x="0" y="100" width="156" height="42"/>
        <text class="item-label" x="12" y="116">3. /implement</text>
        <text class="item-category" x="12" y="130">Write code from plan</text>

        <!-- Phase 4: Refactor -->
        <rect class="item-box" x="0" y="150" width="156" height="42"/>
        <text class="item-label" x="12" y="166">4. /refactor-check</text>
        <text class="item-category" x="12" y="180">Clean up code</text>

        <!-- Phase 5: Review -->
        <rect class="item-box" x="0" y="200" width="156" height="42"/>
        <text class="item-label" x="12" y="216">5. /adversarial-review</text>
        <text class="item-category" x="12" y="230">Gemini code review</text>

        <!-- Phase 6: Static -->
        <rect class="item-box" x="0" y="250" width="156" height="42"/>
        <text class="item-label" x="12" y="266">6. /static-analysis</text>
        <text class="item-category" x="12" y="280">Qodana scan + fix</text>

        <!-- Phase 7: Test -->
        <rect class="item-box" x="0" y="300" width="156" height="42"/>
        <text class="item-label" x="12" y="316">7. /test</text>
        <text class="item-category" x="12" y="330">Write tests</text>

        <!-- Phase 8: Doc -->
        <rect class="item-box" x="0" y="350" width="156" height="42"/>
        <text class="item-label" x="12" y="366">8. /doc-code</text>
        <text class="item-category" x="12" y="380">Generate documentation</text>
      </g>

      <!-- Orchestrator -->
      <g transform="translate(12, 465)">
        <rect class="item-box" x="0" y="0" width="156" height="32" style="stroke: #c8a848; stroke-width: 2;"/>
        <text class="item-label" x="12" y="20" style="fill: #8a7030;">/ralph-loop orchestrator</text>
      </g>
    </g>

    <!-- Flow Arrow: Workflow → Quality -->
    <path class="flow-arrow main" d="M 790,300 C 820,300 830,300 860,300" marker-end="url(#arrowhead-dark)"/>
    <text class="annotation" x="800" y="290">produce</text>

    <!-- ═══════════════════════════════════════════════════════════════════════
         LAYER 4: QUALITY CODE (Output)
    ═══════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(870, 140)">
      <rect class="layer-box quality" x="0" y="0" width="110" height="320" rx="8"/>
      <text class="layer-label" x="16" y="30">Quality</text>
      <text class="layer-label" x="16" y="48">Code</text>

      <!-- Quality attributes -->
      <g transform="translate(12, 75)">
        <text class="item-category" x="0" y="0">Attributes:</text>

        <rect class="item-box" x="0" y="14" width="86" height="26"/>
        <text class="item-label" x="8" y="31">Planned</text>

        <rect class="item-box" x="0" y="48" width="86" height="26"/>
        <text class="item-label" x="8" y="65">Typed</text>

        <rect class="item-box" x="0" y="82" width="86" height="26"/>
        <text class="item-label" x="8" y="99">Reviewed</text>

        <rect class="item-box" x="0" y="116" width="86" height="26"/>
        <text class="item-label" x="8" y="133">Analyzed</text>

        <rect class="item-box" x="0" y="150" width="86" height="26"/>
        <text class="item-label" x="8" y="167">Tested</text>

        <rect class="item-box" x="0" y="184" width="86" height="26"/>
        <text class="item-label" x="8" y="201">Documented</text>
      </g>

      <!-- Final annotation -->
      <text class="annotation" x="16" y="300">Ship-ready</text>
    </g>

    <!-- ═══════════════════════════════════════════════════════════════════════
         ANNOTATIONS: Key insights (data-story: Tell the story)
    ═══════════════════════════════════════════════════════════════════════ -->

    <!-- Annotation: Expert loading -->
    <g transform="translate(330, 545)">
      <text class="annotation" x="0" y="0">Profile activates skills per-phase:</text>
      <text class="annotation" x="0" y="14">plan: js-internals → build: typescript, js-perf → test: react-test</text>
    </g>

  </svg>

  <!-- dashboards: Minimal legend, only if needed -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background: #e8f4f8; border: 1px solid #b8d4de;"></div>
      <span>Canon (expert knowledge)</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #f0f4e8; border: 1px solid #c8d4b8;"></div>
      <span>Profile (domain composition)</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #fff8e8; border: 1px solid #e8d8b8;"></div>
      <span>Workflow (quality gates)</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #e8f8e8; border: 1px solid #b8deb8;"></div>
      <span>Quality Code (output)</span>
    </div>
  </div>

</body>
</html>
