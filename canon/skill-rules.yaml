# Canon Skill Detection Rules
#
# This file configures skill detection for BOTH:
# - Ralph stages (plan, build, refactor, test, review, doc)
# - Workflow commands (/implement, /plan, /review-hard, etc.)
#
# Format:
#   rules:
#     category:
#       patterns: [keyword1, keyword2, ...]   # Case-insensitive, word boundaries
#       skills: [skill1, skill2, ...]          # Canon experts to invoke
#       stages: [plan, build, ...]             # Ralph stages where rule applies
#       workflows: [implement, plan, ...]      # Workflow commands where rule applies
#
#   workflow-defaults:
#     command-name:
#       always: [skill1, skill2]               # Always invoke these
#       phases:                                # Phase-specific canons
#         phase-name: [skill1, skill2]

# =============================================================================
# WORKFLOW DEFAULTS - Core canons for each workflow command
# =============================================================================

workflow-defaults:
  # /plan - Design before implementation
  plan:
    always:
      - kernighan    # Clarity of requirements
      - pike         # Minimal interfaces
      - linus        # Data structures first
    phases:
      design: [cherny, dijkstra]  # Types and invariants

  # /implement - Full canon workflow
  implement:
    always:
      - kernighan    # Clarity throughout
    phases:
      plan: [pike, linus]
      structure: [cherny, dijkstra, gang-of-four]
      build: [thompson, bill-joy]
      test: [meszaros, fowler-test, dodds]
      review: [schneier, owasp]

  # /review-hard - Adversarial review
  review-hard:
    always:
      - schneier     # Think like an attacker
    phases:
      self-review: [kernighan]
      security: [owasp, tanya-janca]
      quality: [bloch]

  # /structure-first - Data structures before code
  structure-first:
    always:
      - linus        # Data structures first
      - cherny       # Type design
      - dijkstra     # Invariants

  # /build-from-plan - Execute approved plan
  build-from-plan:
    always:
      - thompson     # Get it working first
      - kernighan    # Keep it clear

  # /refactor-clean - Systematic cleanup
  refactor-clean:
    always:
      - thompson     # Simplify
      - kernighan    # Clarity
      - pike         # Minimal interfaces

  # /test - Testing strategy
  test:
    always:
      - meszaros     # Test patterns
      - fowler-test  # Test pyramid
    phases:
      unit: [hevery]
      integration: [feathers]
      e2e: [dodds]

