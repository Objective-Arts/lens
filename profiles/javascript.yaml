name: javascript
description: JavaScript/TypeScript expertise - combine with base-tech
projectType: software
composable: true
extends: software-base

ralph:
  skills:
    plan:
      - js-internals   # JS runtime mental model
    build:
      - typescript     # TypeScript types
      - js-safety      # Good parts
      - js-internals   # Closures, scope, this
      - js-perf        # JS design patterns
    refactor:
      - js-perf        # Pattern refactoring
      - js-safety      # Simplify to good parts
    test:
      - react-test     # Testing Trophy
    # review and doc inherit from software-base

skills:
  canon:
    # JavaScript experts
    - js-internals   # Closures, scope, this
    - react-state    # Redux, React patterns, composition
    - functional     # Underscore/Backbone, functional JS
    - typescript     # Type system mastery
    - js-safety      # Language subset
    - react-test     # Testing Trophy, React testing
    - reactivity     # Svelte, reactive programming
    - js-perf        # JavaScript Design Patterns
    # UI/UX experts (frontend JS needs these)
    - components     # Atomic Design - components
    - visual         # Visual design - minimalism
    - usability      # UX psychology - affordances
    - mobile         # Mobile-first, forms
    - motion         # Motion design, animation
    - interaction    # Input design, sketching
    - tokens         # Design systems, tokens
    - typography     # Typography
    - design         # 10 principles - simplicity

claudeMd:
  standards:
    - "Use const by default, let when reassignment needed"
    - "Prefer arrow functions for callbacks"
    - "Use async/await over raw promises"
    - "Destructure objects and arrays"
    - "Use template literals for string interpolation"
    - "Prefer named exports over default exports"
    - "Use TypeScript strict mode"
    - "Avoid any type - prefer unknown when type is uncertain"

  antiPatterns:
    - "var declarations (use const/let)"
    - "Implicit type coercion (use === and !==)"
    - "Global variables"
    - "Callback hell (use async/await)"
    - "Mutating function parameters"
    - "Using any type without justification"
    - "Ignoring promise rejections"

  autoInvoke:
    # JavaScript
    - context: Complex JavaScript runtime, closures, this, scope
      action: INVOKE `/js-internals`
    - context: TypeScript types, generics, inference, utility types
      action: INVOKE `/typescript`
    - context: JavaScript subset, safe patterns, avoiding pitfalls
      action: INVOKE `/js-safety`
    - context: React testing, Testing Library, Testing Trophy
      action: INVOKE `/react-test`
    - context: Redux, React state, composition patterns
      action: INVOKE `/react-state`
    - context: Functional JavaScript, lodash patterns
      action: INVOKE `/functional`
    - context: Svelte, reactive frameworks
      action: INVOKE `/reactivity`
    - context: JavaScript design patterns, module patterns
      action: INVOKE `/js-perf`
    # UI/UX (always invoke for frontend work)
    - context: Building UI components, React components, frontend
      action: INVOKE `/components` then `/visual` then `/usability`
    - context: Forms, inputs, validation UI
      action: INVOKE `/mobile` then `/usability`
    - context: Animations, transitions, motion
      action: INVOKE `/motion`
    - context: Mobile design, responsive, touch
      action: INVOKE `/mobile` then `/interaction`
    - context: Design system, tokens, theming
      action: INVOKE `/tokens`
    - context: Typography, text styling, fonts
      action: INVOKE `/typography`
    - context: CSS, styling, layouts
      action: INVOKE `/design`
