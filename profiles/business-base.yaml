name: business-base
description: Base canon for business strategy and management projects.
projectType: business
composable: true

ralph:
  skills:
    plan:
      - competition    # Competitive strategy
      - strategy       # Good strategy/bad strategy
      - management     # OKRs, execution
    build:
      - management     # High output management
      - leadership     # Hard things execution
    review:
      - leadership     # Reality check
      - competition    # Strategic review
    doc:
      - moats          # Business writing
      - data-story     # Data presentation

skills:
  canon:
    # Strategy
    - management     # High Output Management, OKRs, paranoid leadership
    - competition    # Competitive strategy, five forces, value chain
    - strategy       # Good Strategy/Bad Strategy, kernel of strategy
    # Execution
    - leadership     # Hard things, wartime CEO, management
    # Analysis
    - moats          # Scenario planning, strategic foresight

claudeMd:
  standards:
    - "Start with diagnosis before prescription"
    - "Strategy is a coherent set of actions, not goals"
    - "Focus on leverage points"
    - "Understand your competitive position"
    - "Peacetime vs wartime requires different approaches"

  antiPatterns:
    - "Fluff - restating the obvious dressed up as strategy"
    - "Failure to face the challenge"
    - "Mistaking goals for strategy"
    - "Bad strategic objectives (too many, unfocused)"

  autoInvoke:
    - context: Strategic planning, competitive analysis
      action: INVOKE `/competition` then `/strategy`
    - context: Management, OKRs, organizational design
      action: INVOKE `/management`
    - context: Startup decisions, hard choices, crisis management
      action: INVOKE `/leadership`
    - context: Scenario planning, future uncertainty
      action: INVOKE `/moats`
