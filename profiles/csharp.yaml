name: csharp
description: Domain canon for C#/.NET projects
projectType: software
composable: true
extends: software-base

skills:
  canon:
    - csharp-depth   # C# in Depth - language mechanics, generics, edge cases
    - async          # Concurrency in C# - async/await, Task, threading
    - type-systems   # Language design philosophy, type system decisions
    - java           # API design principles (transfers well)
    - dotnet-core    # ASP.NET Core — middleware, DI, minimal APIs, auth
    - dotnet-data    # Entity Framework Core — DbContext, migrations, N+1, Dapper
    - dotnet-di      # Dependency injection — lifetimes, composition root, options pattern
    - dotnet-testing # xUnit, NSubstitute, FluentAssertions, WebApplicationFactory
    - linq-advanced  # Advanced LINQ — IQueryable, deferred execution, GroupBy, performance
    - dotnet-perf    # .NET performance — Span<T>, ArrayPool, ObjectPool, BenchmarkDotNet

claudeMd:
  standards:
    # Modern C# idioms
    - "Use records for immutable data types"
    - "Prefer pattern matching over type checks and casts"
    - "Use nullable reference types (enable in project)"
    - "Prefer init-only properties for immutability"
    - "Use file-scoped namespaces (C# 10+)"
    - "Prefer primary constructors where appropriate (C# 12+)"

    # Async/await
    - "Use async/await all the way down - no sync-over-async"
    - "Use ConfigureAwait(false) in library code"
    - "Prefer ValueTask for hot paths that often complete synchronously"
    - "Use CancellationToken for cancellable operations"
    - "Avoid async void except for event handlers"

    # LINQ
    - "Prefer LINQ query syntax for complex joins, method syntax for simple chains"
    - "Use deferred execution intentionally - materialize with ToList() when needed"
    - "Avoid multiple enumeration of IEnumerable"

    # Memory and performance
    - "Use Span<T> and Memory<T> for high-performance buffer operations"
    - "Prefer structs for small, immutable value types (< 16 bytes)"
    - "Use ArrayPool<T> for frequently allocated arrays"

    # API design
    - "Return empty collections, not null"
    - "Favor composition over inheritance"
    - "Make classes sealed by default unless designed for inheritance"

  antiPatterns:
    - "async void methods (except event handlers)"
    - "Blocking on async code (.Result, .Wait())"
    - "Returning null from collections or arrays"
    - "Throwing exceptions for flow control"
    - "Using dynamic when static typing is possible"
    - "Mutable structs"
    - "Large structs (> 16 bytes) passed by value"
    - "Capturing loop variables in closures (pre-C# 5 habit)"
    - "Using lock on public objects or this"
    - "Ignoring CancellationToken in async methods"
    - "Multiple enumeration of IEnumerable without materialization"

  autoInvoke:
    - context: C# language features, generics, covariance, edge cases
      action: INVOKE `/csharp-depth`
    - context: async/await, Task, CancellationToken, concurrency, threading
      action: INVOKE `/async`
    - context: Language design decisions, type system, why C# works this way
      action: INVOKE `/type-systems`
    - context: API design, immutability, builders, factory methods
      action: INVOKE `/java`
    - context: ASP.NET Core, middleware, minimal APIs, controllers, authentication
      action: INVOKE `/dotnet-core`
    - context: Entity Framework, DbContext, migrations, database queries, Dapper
      action: INVOKE `/dotnet-data`
    - context: Dependency injection, service lifetimes, IOptions, composition root
      action: INVOKE `/dotnet-di`
    - context: xUnit, unit testing, integration testing, NSubstitute, FluentAssertions
      action: INVOKE `/dotnet-testing`
    - context: Advanced LINQ, IQueryable, GroupBy, SelectMany, deferred execution
      action: INVOKE `/linq-advanced`
    - context: .NET performance, Span, ArrayPool, allocation, BenchmarkDotNet
      action: INVOKE `/dotnet-perf`
