name: software-base
description: Base canon for ALL software projects. Always included.
projectType: software
composable: true

skills:
  canon:
    # THE BASELINE BRAIN - masters that shape all code
    - clarity        # Clarity, readability, style
    - pragmatism     # Pragmatism, brute force, get it working
    - simplicity     # Small interfaces, composition
    - composition    # Unix philosophy, do one thing well, pipelines
    - distributed    # Distributed systems, failure handling
    - data-first     # Good taste, data structures first
    - correctness    # Formal discipline, correctness
    - algorithms     # Algorithms, literate programming, rigor
    - abstraction    # Substitution principle, type contracts
    - optimization   # Performance, clean code, pragmatic optimization
    # Design patterns
    - design-patterns   # Classic OOP patterns
    # Security mindset
    - security-mindset  # Think like an attacker
    - owasp             # Vulnerability patterns, Top 10
    # Engineering wisdom
    - failure        # Form follows failure
    - safety         # STAMP/STPA safety analysis
    - resilience     # Antifragility, black swans
    # Documentation & Writing
    - docs           # Diataxis framework
    - prose          # Clarity, remove clutter
    - brevity        # Omit needless words, active voice
    - editing        # Kill your darlings, practical writing
    # Testing
    - react-test     # Testing Trophy, integration-first
    - legacy         # Legacy code testing
    - test-doubles   # xUnit patterns, test doubles
    - test-strategy  # Test pyramid
    # Pitfalls
    - pitfalls       # Known bug patterns and code traps

agents:
  - security-auditor
  - code-reviewer
  - test-engineer

claudeMd:
  standards:
    # Base Brain principles
    - "Clarity over cleverness"
    - "Data structures first, algorithms follow"
    - "Small, composable interfaces"
    - "Do one thing and do it well"
    - "Handle failure explicitly"
    - "Correctness by construction"
    - "Get it working first, then optimize"
    - "Measure before optimizing"
    - "Subtypes must be substitutable"
    # Security
    - "Think like an attacker"
    - "Validate all input, encode all output"
    # Engineering
    - "Learn from failures"
    - "Safety is a system property"

  antiPatterns:
    - "Clever code that requires comments to understand"
    - "Deep inheritance hierarchies"
    - "Ignoring error conditions"
    - "Premature optimization without measurement"
    - "Functions longer than 30 lines"
    - "Trusting user input"
    - "Security through obscurity"
    - "Violating substitution principle"
    - "God objects that do everything"

  autoInvoke:
    - context: Writing any code
      action: Apply Base Brain lens (clarity, simplicity, composition, data-first, correctness)
    - context: Performance-critical code
      action: INVOKE `/optimization` for optimization patterns
    - context: Algorithm design
      action: INVOKE `/algorithms` for algorithmic rigor
    - context: OOP design, inheritance, patterns
      action: INVOKE `/abstraction` then `/design-patterns`
    - context: Security-sensitive code (auth, input, data)
      action: INVOKE `/security-mindset` then `/owasp`
    - context: Writing tests
      action: INVOKE `/test-doubles` for test patterns
    - context: Working with legacy code
      action: INVOKE `/legacy` for seams and characterization tests
    - context: Writing documentation
      action: INVOKE `/docs` for Diataxis, `/prose` for clarity
    - context: Writing READMEs, comments, commit messages
      action: INVOKE `/brevity` (omit needless words) and `/editing` (kill darlings)
    - context: Analyzing failures or risks
      action: INVOKE `/failure` and `/safety`
