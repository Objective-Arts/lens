name: typescript-cli
description: TypeScript CLI/backend projects. Node.js, no frontend.
projectType: software
composable: true

# Combine with software-base for complete coverage:
#   cc-config profile apply software-base+typescript-cli .

skills:
  canon:
    # TypeScript mastery
    - typescript      # Programming TypeScript - inference, generics, type guards
    - type-systems    # TypeScript compiler, type system design

    # JavaScript foundations
    - js-safety       # JavaScript safe subset
    - js-internals    # Closures, this, scope, prototypes
    - js-perf         # JavaScript design patterns, module patterns
    - functional      # Functional JS, lodash patterns
    - async           # Async patterns, promises, event loop

    # Node.js
    - composition     # Unix philosophy for CLI design
    - simplicity      # Small tools, composition

claudeMd:
  standards:
    # TypeScript
    - "Let TypeScript infer types - annotate sparingly"
    - "Use discriminated unions for state machines"
    - "Prefer unknown over any, narrow with type guards"
    - "Use const assertions for literal types"
    - "Understand the type system, don't fight it"

    # JavaScript
    - "Avoid the bad parts - with, eval, implied globals"
    - "Understand closures, this binding, scope chain"
    - "Use strict mode always"
    - "Prefer composition over inheritance"

    # Async
    - "Use async/await over raw promises"
    - "Understand the event loop - never block it"
    - "Handle promise rejections explicitly"

    # CLI/Node
    - "Do one thing well, compose with pipes"
    - "Exit codes matter - 0 for success, non-zero for failure"
    - "Stderr for errors and diagnostics, stdout for output"

  antiPatterns:
    - "Over-annotating types TypeScript can infer"
    - "Using any instead of unknown"
    - "Ignoring strict mode warnings"
    - "Type assertions (as) instead of type guards"
    - "Blocking the event loop with sync operations"
    - "Memory leaks from unclosed handles or listeners"
    - "var declarations (use const/let)"
    - "Implicit type coercion (use === and !==)"
    - "Callback hell (use async/await)"
    - "Ignoring promise rejections"
    - "Mixing stdout and stderr incorrectly"

  autoInvoke:
    - context: TypeScript types, generics, inference, utility types
      action: INVOKE /typescript
    - context: Type guards, discriminated unions, exhaustive checks
      action: INVOKE /typescript
    - context: TypeScript compiler behavior, type system edge cases
      action: INVOKE /type-systems
    - context: JavaScript closures, this, scope, prototypes
      action: INVOKE /js-internals
    - context: JavaScript pitfalls, safe patterns
      action: INVOKE /js-safety
    - context: Async/await, promises, event loop
      action: INVOKE /async
    - context: Functional patterns, lodash-style operations
      action: INVOKE /functional
    - context: Module patterns, design patterns in JS
      action: INVOKE /js-perf
    - context: CLI argument parsing, stdin/stdout handling
      action: INVOKE /composition and /simplicity
