name: frontend
description: UI/UX canon for frontend projects. 12 experts for beautiful interfaces without being a designer.
composable: true

ralph:
  skills:
    plan:
      - personas       # Interaction design
      - usability      # Affordances
      - charts         # Information design
    build:
      - components     # Atomic design
      - visual         # Visual minimalism
      - usability      # UX principles
      - mobile         # Mobile-first, forms
      - motion         # Motion design
      - interaction    # Input design
      - tokens         # Design systems
      - typography     # Typography
      - design         # 10 principles
      - handoff        # Design-dev handoff
      - charts         # Information design
    refactor:
      - components     # Component extraction
      - design         # Simplification
    review:
      - usability      # UX review
      - personas       # Interaction critique
    doc:
      - charts         # Visual documentation

skills:
  canon:
    # Philosophy & Psychology
    - design         # 10 Principles - less but better
    - usability      # Affordances, feedback, mental models
    - personas       # Goal-directed design, eliminate excise
    # Visual & Typography
    - visual         # Minimalism, material honesty
    - typography     # Type-first hierarchy
    # Motion & Interaction
    - motion         # Material motion, meaningful transitions
    - interaction    # Input fundamentals
    # Patterns & Components
    - mobile         # Mobile-first, forms, thumb zones
    - components     # Atomic design, reusable systems
    # Governance & Collaboration
    - tokens         # Versioning, documentation, tokens
    - handoff        # Designer-dev handoff

agents:
  - css-expert
  - accessibility-tester

claudeMd:
  autoInvoke:
    - context: "Building UI component"
      action: "INVOKE `/components` then `/visual`"
    - context: "Designing forms"
      action: "INVOKE `/mobile` then `/usability`"
    - context: "Adding animation"
      action: "INVOKE `/motion`"
    - context: "Mobile design"
      action: "INVOKE `/mobile` then `/interaction`"
    - context: "CSS styling, layouts"
      action: "INVOKE `/design` for simplicity check"
    - context: "Modals, dialogs, confirmations"
      action: "INVOKE `/personas` for goal-directed design"
