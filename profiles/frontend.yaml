name: frontend
description: UI/UX canon for frontend projects. 12 experts for beautiful interfaces without being a designer.
composable: true

ralph:
  skills:
    plan:
      - cooper         # Interaction design
      - norman         # Affordances
      - tufte          # Information design
    build:
      - frost          # Atomic design
      - ive            # Visual minimalism
      - norman         # UX principles
      - wroblewski     # Mobile-first, forms
      - duarte         # Motion design
      - buxton         # Input design
      - curtis         # Design systems
      - kruzeniski     # Typography
      - rams           # 10 principles
      - mall           # Design-dev handoff
      - tufte          # Information design
    refactor:
      - frost          # Component extraction
      - rams           # Simplification
    review:
      - norman         # UX review
      - cooper         # Interaction critique
    doc:
      - tufte          # Visual documentation

skills:
  canon:
    # Philosophy & Psychology
    - rams           # 10 Principles - less but better
    - norman         # Affordances, feedback, mental models
    - cooper         # Goal-directed design, eliminate excise
    # Visual & Typography
    - ive            # Minimalism, material honesty
    - kruzeniski     # Type-first hierarchy
    # Motion & Interaction
    - duarte         # Material motion, meaningful transitions
    - buxton         # Input fundamentals
    # Patterns & Components
    - wroblewski     # Mobile-first, forms, thumb zones
    - frost          # Atomic design, reusable systems
    # Governance & Collaboration
    - curtis         # Versioning, documentation, tokens
    - mall           # Designer-dev handoff

agents:
  - css-expert
  - accessibility-tester

claudeMd:
  autoInvoke:
    - context: "Building UI component"
      action: "INVOKE `/frost` then `/ive`"
    - context: "Designing forms"
      action: "INVOKE `/wroblewski` then `/norman`"
    - context: "Adding animation"
      action: "INVOKE `/duarte`"
    - context: "Mobile design"
      action: "INVOKE `/wroblewski` then `/buxton`"
    - context: "CSS styling, layouts"
      action: "INVOKE `/rams` for simplicity check"
    - context: "Modals, dialogs, confirmations"
      action: "INVOKE `/cooper` for goal-directed design"
