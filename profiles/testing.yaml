name: testing
description: Extended testing canon for comprehensive test coverage
projectType: software
composable: true

ralph:
  skills:
    test:
      - meszaros       # xUnit patterns
      - fowler-test    # Test pyramid
      - feathers       # Characterization tests
      - dodds          # Testing Trophy
      - hevery         # Testability

skills:
  canon:
    - dodds          # Testing Trophy, integration-first
    - feathers       # Legacy code testing, characterization tests
    - meszaros       # Test patterns, test doubles
    - fowler-test    # Test pyramid, testing strategy

agents:
  - test-engineer
  - qa-expert
  - test-automator

flags:
  default:
    - --test-complete

hooks:
  PreCommit:
    - name: test-verification
      description: Verify tests exist for changed code
      command: test-check.sh
      failureMessage: "Missing tests. Run with --test-complete flag."

autoInvoke:
  - context: "Writing unit tests"
    skills: [meszaros, dodds]
  - context: "Writing integration tests"
    skills: [fowler-test, dodds]
  - context: "Testing legacy code"
    skills: [feathers, meszaros]
  - context: "Test doubles, mocks, stubs"
    skills: [meszaros]
  - context: "Test strategy, test levels"
    skills: [fowler-test]
  - context: "E2E tests, Playwright, Cypress"
    skills: [dodds, fowler-test]
