name: angular
description: Angular frontend. Combine with javascript profile.
projectType: software
composable: true
extends: javascript

ralph:
  skills:
    plan:
      - angular-core   # DI architecture
      - angular-perf   # Angular patterns
    build:
      - angular-core   # Angular core
      - rxjs           # RxJS
      - angular-perf   # Performance
      - angular-arch   # Angular best practices
    refactor:
      - angular-perf   # Angular optimization
      - rxjs           # RxJS refactoring
    test:
      - angular-core   # Angular testing

skills:
  canon:
    - angular-core   # DI, testability, component design
    - angular-arch   # Angular architecture, module organization, state patterns
    - angular-perf   # Performance - lazy loading, OnPush, bundle optimization
    - rxjs           # RxJS patterns - streams, operators, subscription management

agents:
  - css-expert
  - accessibility-tester

claudeMd:
  standards:
    - "Use OnPush change detection strategy"
    - "Prefer signals over BehaviorSubject for state"
    - "Use standalone components (not NgModules)"
    - "Inject services in constructors, not property injection"
    - "Use trackBy with ngFor"
    - "Lazy load feature routes"
    - "Use async pipe for observables in templates"
    - "Keep components small and focused"

  antiPatterns:
    - "Default change detection for performance-critical components"
    - "Manual subscription management (use async pipe)"
    - "Business logic in components (use services)"
    - "Direct DOM manipulation"
    - "Large shared modules"
    - "Circular dependencies between services"
    - "Not unsubscribing from long-lived observables"

  autoInvoke:
    - context: Angular DI, testability, component architecture
      action: INVOKE `/angular-core`
    - context: Module organization, feature structure, state management
      action: INVOKE `/angular-arch`
    - context: Performance, lazy loading, change detection, bundle size
      action: INVOKE `/angular-perf`
    - context: RxJS, observables, streams, async composition
      action: INVOKE `/rxjs`
