name: java
description: Domain canon for Java projects
projectType: software
composable: true
extends: software-base

skills:
  canon:
    - java           # Effective Java - API design, immutability, builders

claudeMd:
  standards:
    - "Prefer static factory methods over constructors"
    - "Minimize mutability - make fields final by default"
    - "Favor composition over inheritance"
    - "Design for inheritance or prohibit it (final classes)"
    - "Return empty collections, not null"
    - "Use enums instead of int constants"
    - "Prefer interfaces to abstract classes"
    - "Use bounded wildcards for API flexibility"

  antiPatterns:
    - "Mutable public fields"
    - "Returning null from collections"
    - "Checked exceptions for recoverable conditions"
    - "Raw types (use generics)"
    - "String concatenation in loops"
    - "Finalizers and cleaners for resource management"
    - "Inheritance for code reuse (use composition)"

  autoInvoke:
    - context: Java API design, collections, builders, immutability
      action: INVOKE `/java`
    - context: Code clarity, naming, magic numbers, readability
      action: INVOKE `/clarity`
    - context: Design patterns, Factory, Strategy, Observer, Decorator
      action: INVOKE `/design-patterns`
    - context: Inheritance design, LSP violations, type hierarchies
      action: INVOKE `/abstraction`
